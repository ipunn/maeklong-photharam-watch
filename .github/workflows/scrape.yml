name: Scrape water levels

on:
  schedule:
    # Off-peak minutes on purpose: GitHub delays or drops scheduled runs at the busiest
    # minutes (:00, :15, :30, :45). Every 15 minutes, offset by 7.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape-waterlevel
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/scrape-waterlevel.js
      - name: Commit updated history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "Scrape water levels $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # A push made while this job ran must not lose the data: rebase and retry.
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "push attempt $attempt failed; retrying"; sleep $((attempt * 5))
          done
          exit 1
